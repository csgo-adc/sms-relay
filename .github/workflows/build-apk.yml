name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.SMS_RELAY_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.SMS_RELAY_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.SMS_RELAY_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.SMS_RELAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p release-signing
          echo "$KEYSTORE_BASE64" | base64 --decode > release-signing/sms-relay-release.p12
          cat > keystore.properties <<EOF
          storeFile=release-signing/sms-relay-release.p12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-relay-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish signed APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
